<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Donation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="donation.html">Donate</a></li>
                <li><a href="view.php">View Donation</a></li>
                <li><a href="devs.html">Devs</a></li>
            </ul>
        </nav>
    </header>
    <!-- This form collects donation details and sends them to connect.php using the POST method, where the data is saved to the database. -->
    <div class="donasyon_form">
        <h1>Donation Form</h1>

        <form action="connect.php" method="post">         <!-- Form that sends data to connect.php using POST method -->

            <label for="item_name">Item Name</label><br>       <!-- Label for item name input -->
            <input type="text" id="item_name" name="item_name" required><br><br>

            <label for="category">Category</label><br>  <!-- Label for category dropdown -->
            <select id="category" name="category" required>  <!-- Dropdown menu for selecting category -->
                <option value="">Select Category</option>   <!-- Default placeholder option -->
                <option value="Clothes">Clothes</option>
                <option value="Foods">Foods</option>
                <option value="School Supplies">School Supplies</option>
                <option value="Toys">Toys</option>
                <option value="Books">Books</option>
                
            </select><br><br>

            <label for="quantity">Quantity</label>     <!-- Label for quantity input -->
            <input type="number" id="quantity" name="quantity" min="1" required>

            <label>Condition</label><br>    <!-- Label for item condition -->
            <input type="radio" id="new" name="Condition" value="New" required>
            <label for="new">New</label><br>

            <input type="radio" id="good" name="Condition" value="Good" required>
            <label for="good">Good</label><br>

            <input type="radio" id="used" name="Condition" value="Used" required>
            <label for="used">Used</label><br><br>

            <label for="date_received">Date Received</label>    <!-- Label for date received -->
            <input type="date" id="date_received" name="date_received" required><br><br>      <!-- Date input -->

            <label for="donated_By">Donated By</label>   <!-- Label for donor name -->
            <input type="text" id="donated_By" name="donated_by"><br><br>

            <input type="submit" name="submit" value="Add Donation">     <!-- Submit button to send form data -->

        </form>
    </div>

    <footer class="footer">
        <p>Copyright &copy; 2025 Group 3 | All Rights Reserved</p>
    </footer>

</body>
</html>
